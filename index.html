<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>braidbabes waitlist</title>
<link rel="stylesheet" href="./shared/styles.css">
<style>
  .shell { justify-content: center; padding: 40px 26px; gap: 12px; }
  .links { display: grid; gap: 10px; margin-top: 30px; }
  .links a {
    display: block; text-decoration: none; text-align: center;
    font-size: 12.5px; font-weight: 500; padding: 13px 20px; border-radius: 8px;
  }
  .go-customer { background: var(--pink); color: #fff; }
  .go-admin { background: #fff; color: var(--pink-700); border: 1px solid var(--pink-line); }
  .hint { font-size: 11px; font-weight: 400; color: var(--muted); text-align: center;
          line-height: 1.7; margin-top: 26px; }
</style>
</head>
<body>
<div class="shell">
  <div class="wordmark">
    <img class="logo" src="./assets/logo-color.png" alt="braidbabes" width="600" height="198">
    <div class="script">Waitlist</div>
  </div>

  <div class="links">
    <a class="go-customer" href="./customer/">customer (where the QR code leads)</a>
    <a class="go-admin" href="./admin/">admin</a>
  </div>

  <p class="hint">
    this page is just a launcher for testing.<br>
    at an event, the QR code goes straight to <b>/customer/</b>.
  </p>
</div>
</body>
</html>
